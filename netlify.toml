[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Decap CMS admin lives at /admin (served from public/admin/index.html).
# Static files always win over the rule below, so /admin and /content/*.json
# are served directly; everything else falls back to the React app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Content JSON is edited from the admin panel: never cache it for long,
# so new films/photos show up as soon as Netlify finishes the rebuild.
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
